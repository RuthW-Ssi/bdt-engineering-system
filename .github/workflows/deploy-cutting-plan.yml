name: Deploy Cutting Plan service to Cloud Run

# Plate nesting-report parser (bdt-cutting-plan-service/), moved here 2026-11-06 from
# RuthW-Ssi/bdt-cutting-plan-system. That repo is still in use and still deploys this same Cloud Run service on
# push to its main (buildpacks); such a push replaces this image until the next staging deploy here.
# IAM-only service (no --allow-unauthenticated); invoked by NestJS with a Google ID token.
# Same settings as deploy-scheduler.yml: min 0, max 2 (was 20), startup CPU boost on, IAM only, runtime SA =
# default compute SA — no cost increase. Size as before the move (1 vCPU, 1Gi).

on:
  push:
    branches: [staging]
    paths:
      - 'bdt-cutting-plan-service/**'
      - '.github/workflows/deploy-cutting-plan.yml'

# One deploy of this service at a time; a newer push waits rather than racing it.
concurrency:
  group: deploy-bdt-cutting-plan-service
  cancel-in-progress: false

env:
  PROJECT_ID: building-technology-493907
  REGION: asia-northeast1
  AR_REGION: asia-southeast1
  SERVICE: bdt-cutting-plan-service
  IMAGE: asia-southeast1-docker.pkg.dev/building-technology-493907/bdt-backend/bdt-cutting-plan-service
  BACKEND_SA: 489818756412-compute@developer.gserviceaccount.com

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bdt-cutting-plan-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  deploy:
    name: Build and deploy to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$AR_REGION-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          docker build \
            -t "$IMAGE:$GITHUB_SHA" \
            -t "$IMAGE:latest" \
            ./bdt-cutting-plan-service
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

      # concurrency 1: the ETL writes each request's files under ./data and was only ever run one at a time.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE:$GITHUB_SHA" \
            --platform managed \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --port 8080 \
            --min-instances 0 \
            --max-instances 2 \
            --memory 1Gi \
            --cpu 1 \
            --timeout 300 \
            --concurrency 1 \
            --cpu-boost \
            --no-allow-unauthenticated

      # NestJS runs as the default compute SA; it is the only caller (idempotent — also covers a fresh service).
      - name: Allow the backend to invoke
        run: |
          gcloud run services add-iam-policy-binding "$SERVICE" \
            --member "serviceAccount:$BACKEND_SA" \
            --role roles/run.invoker \
            --region "$REGION" \
            --project "$PROJECT_ID"

      - name: Route traffic to new revision
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --to-latest \
            --region "$REGION" \
            --project "$PROJECT_ID"

      # No ID token here: check the control plane only.
      - name: Verify service
        run: |
          describe() {
            gcloud run services describe "$SERVICE" \
              --region "$REGION" --project "$PROJECT_ID" --format "value($1)"
          }
          URL=$(describe status.url)
          READY=$(describe status.latestReadyRevisionName)
          CREATED=$(describe status.latestCreatedRevisionName)
          if [ -z "$URL" ]; then
            echo "::error::$SERVICE has no URL after deploy"
            exit 1
          fi
          if [ "$READY" != "$CREATED" ]; then
            echo "::error::latest revision $CREATED is not ready (serving $READY)"
            exit 1
          fi
          if POLICY=$(gcloud run services get-iam-policy "$SERVICE" \
                --region "$REGION" --project "$PROJECT_ID" --format json); then
            if echo "$POLICY" | grep -qE '"(allUsers|allAuthenticatedUsers)"'; then
              echo "::error::$SERVICE is publicly invokable; it must be IAM-only"
              exit 1
            fi
          else
            echo "::error::could not read the IAM policy of $SERVICE; refusing to pass without the public-access check"
            exit 1
          fi
          echo "$SERVICE ready: $URL (revision $READY)"
